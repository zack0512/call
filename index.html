<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏡頭測試</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding: 20px;">
    <h2>手機鏡頭簡單測試</h2>
    <button id="cam-btn" style="padding: 15px 25px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px;">開啟相機</button>
    <br><br>
    <video id="test-video" autoplay playsinline style="width: 100%; max-width: 400px; background: black; border-radius: 8px;"></video>

    <script>
        const btn = document.getElementById('cam-btn');
        const video = document.getElementById('test-video');

        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                alert('相機成功開啟！');
            } catch (err) {
                alert('開啟失敗：' + err.name + '\n' + err.message);
            }
        };
    </script>
</body>
</html>
